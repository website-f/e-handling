worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  # Never log the request body; IC numbers travel in POST bodies only.
  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s up=$upstream_response_time';
  access_log /var/log/nginx/access.log main buffer=64k flush=5s;

  # Real client IP. On the VPS, Orxies terminates TLS and overwrites X-Real-IP with the
  # caller's address; requests reach us via docker-proxy, so only trust loopback/bridge peers.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Real-IP;

  # Per-client rate limits. Mobile carriers put many users behind one CGNAT IP, so bursts are generous.
  limit_req_zone $binary_remote_addr zone=public_api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:20m;

  # Docker DNS: `resolve` re-reads the api service's replica IPs, so `--scale api=N` needs no reload.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api_upstream 64k;
    least_conn;
    server api:8080 resolve max_fails=3 fail_timeout=5s;
    keepalive 128;
  }

  server {
    listen 80 reuseport;
    root /usr/share/nginx/html;
    limit_conn perip 60;

    include /etc/nginx/security-headers.conf;

    location = /api/health {
      proxy_pass http://api;
      include /etc/nginx/proxy-common.conf;
    }

    location /api/admin/ {
      limit_req zone=admin_api burst=30 nodelay;
      proxy_pass http://api;
      proxy_buffering off; # stream CSV exports
      include /etc/nginx/proxy-common.conf;
    }

    location /api/ {
      limit_req zone=public_api burst=60 nodelay;
      client_max_body_size 16k;
      proxy_pass http://api;
      include /etc/nginx/proxy-common.conf;
    }

    # Candidate portraits written by the photos worker. Filenames carry a content hash, so they
    # can be cached hard; a replaced photo gets a new name.
    location /photos/ {
      alias /usr/share/nginx/photos/;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
